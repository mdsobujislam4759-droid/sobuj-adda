<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobuj Adda</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f0f2f5; color: #1c1e21; padding-bottom: 60px; }
        header { background-color: #1b74e4; color: white; padding: 12px 16px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; }
        .card { background: white; border-radius: 8px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .create-post textarea { width: 100%; border: none; outline: none; resize: none; font-size: 15px; padding: 8px; background: #f0f2f5; border-radius: 20px; margin-bottom: 10px; padding-left: 15px; }
        .post-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e4e6eb; padding-top: 8px; }
        .upload-label { font-size: 14px; color: #4b4f56; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .upload-label input { display: none; }
        .post-btn { background: #1b74e4; color: white; border: none; padding: 6px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .post-header { font-weight: bold; color: #050505; margin-bottom: 4px; }
        .post-time { font-size: 12px; color: #65676b; margin-bottom: 8px; }
        .post-content { font-size: 15px; margin-bottom: 10px; word-break: break-word; }
        .post-media { width: 100%; max-height: 300px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; display: none; }
        .comment-section { border-top: 1px solid #f0f2f5; padding-top: 8px; margin-top: 8px; }
        .comment-list { font-size: 13px; color: #4b4f56; margin-bottom: 6px; background: #f0f2f5; padding: 6px 10px; border-radius: 10px; }
        .comment-box { display: flex; gap: 6px; }
        .comment-box input { flex: 1; border: 1px solid #ccd0d5; border-radius: 15px; padding: 6px 12px; outline: none; font-size: 13px; }
        .comment-box button { background: #e4e6eb; border: none; padding: 6px 12px; border-radius: 15px; font-weight: bold; cursor: pointer; color: #4b4f56; }
        nav.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; justify-content: space-around; border-top: 1px solid #ddd; padding: 10px 0; z-index: 1000; }
        nav.bottom-nav a { text-decoration: none; color: #65676b; font-size: 14px; font-weight: bold; }
        nav.bottom-nav a.active { color: #1b74e4; }
    </style>
</head>
<body>

    <header>
        <span>Sobuj Adda</span>
        <span style="font-size: 16px;">Message</span>
    </header>

    <div class="container">
        <!-- Status Box -->
        <div class="card create-post">
            <textarea id="postText" rows="2" placeholder="What's on your mind, Sobuj?"></textarea>
            <div class="post-actions">
                <label class="upload-label">
                    📷 Photo/Video
                    <input type="file" id="mediaInput" accept="image/*,video/*">
                </label>
                <button class="post-btn" onclick="createPost()">Post</button>
            </div>
        </div>

        <!-- Feed Container -->
        <div id="feedContainer">
            <!-- Sample Post -->
            <div class="card">
                <div class="post-header">Sobuj Bhai</div>
                <div class="post-time">Just now</div>
                <div class="post-content">Welcome to the new version of Sobuj Adda! You can share your thoughts, photos, and short videos here freely.</div>
                <div class="comment-section">
                    <div class="comment-list"><b>Sakib:</b> Great platform brother!</div>
                    <div class="comment-box">
                        <input type="text" placeholder="Write a comment...">
                        <button onclick="alert('Comment added!')">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="active">Home</a>
        <a href="#">Chats</a>
        <a href="#">Adda</a>
        <a href="#">Profile</a>
    </nav>

    <script>
        let selectedMediaUrl = "";

        document.getElementById('mediaInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                selectedMediaUrl = URL.createObjectURL(file);
                alert("Media attached successfully!");
            }
        });

        function createPost() {
            let text = document.getElementById('postText').value.trim();
            if(text === "" && selectedMediaUrl === "") {
                alert("Please write something or attach a photo/video!");
                return;
            }

            let feed = document.getElementById('feedContainer');
            let postCard = document.createElement('div');
            postCard.className = "card";

            let mediaHTML = selectedMediaUrl ? `<img src="${selectedMediaUrl}" class="post-media" style="display:block;">` : '';

            postCard.innerHTML = `
                <div class="post-header">Sobuj Bhai</div>
                <div class="post-time">Just now</div>
                <div class="post-content">${text}</div>
                ${mediaHTML}
                <div class="comment-section">
                    <div class="comment-box">
                        <input type="text" placeholder="Write a comment...">
                        <button onclick="alert('Comment added!')">Send</button>
                    </div>
                </div>
            `;

            feed.prepend(postCard);
            document.getElementById('postText').value = "";
            selectedMediaUrl = "";
            document.getElementById('mediaInput').value = "";
        }
    </script>
</body>
</html>
